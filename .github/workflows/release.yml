name: release

# Build the tarball in the cloud and attach it to a GitHub Release whenever a
# v* tag is pushed (e.g. `git tag v0.1.1 && git push origin v0.1.1`).
#
# The build is self-contained: `pnpm build` (tsdown) bundles the browser
# half (Shiki inlined) from src and copies the plain-JS host half into lib,
# with no deepseek-harness checkout needed. Typecheck is not part of CI.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Build browser bundle + host half
        run: pnpm build

      - name: Pack tarball
        run: pnpm pack

      - name: Create/update release and attach tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TGZ="dsh-fs-browser-${{ env.version }}.tgz"
          # The release may already exist (e.g. created via the plugin's
          # github_releases tool) — attach the asset to it in that case.
          gh release create "$TAG" \
            --title "dsh-fs-browser ${{ env.version }}" \
            --notes "Automated build from GitHub Actions: browser bundle (Shiki inlined) + host half packed into \`$TGZ\`. Install with \`dsh plugin --profile <name> add ./$TGZ\` and restart the GUI." >/dev/null 2>&1 || true
          gh release upload "$TAG" "$TGZ" --clobber